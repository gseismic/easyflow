[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyflow"
version = "0.1.0"
description = "Single-node Airflow-compatible workflow subset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "croniter>=6.2.3,<7",
    "jinja2>=3.1",
]

[project.scripts]
easyflow = "easyflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
